spring:
  application:
    name: employee-leave-hub-api
  datasource:
    url: jdbc:h2:mem:leavehub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ZW1wbG95ZWUtbGVhdmUtaHViLWRlbW8tc2VjcmV0LWtleS0yMDI2LWNoYW5nZS1pbi1wcm9kdWN0aW9uLXBseA==
    expiration-hours: 8
  storage:
    location: data/uploads
  demo-data: true

logging:
  level:
    org.springframework.security: INFO
